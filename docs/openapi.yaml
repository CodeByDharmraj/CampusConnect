      requestBody:
        required: true
        description: JSON request body; see API-REFERENCE.md and the corresponding validation module.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      security:
        - refreshCookie: []
      description: Trusted-origin checks apply. Refresh/logout use the HttpOnly refresh cookie.
  '/auth/refresh':
