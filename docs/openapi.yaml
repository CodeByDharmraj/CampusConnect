openapi: 3.1.0
info:
  title: CampusConnect API
  version: 1.0.0
  description: |
    Route catalogue for the CampusConnect API. Exact request validation and
    domain rules are implemented in server/src/validation and server/src/services.
servers:
  - url: http://localhost:5000/api/v1
    description: Local development
  - url: https://{apiHost}/api/v1
    description: Deployed API (replace apiHost with the configured API host)
    variables:
      apiHost:
        default: campusconnect-api.example.com
security:
  - bearerAuth: []
tags:
  - name: Health
  - name: Authentication
  - name: Academic
  - name: Attendance
  - name: Assignments and files
  - name: Announcements
  - name: Campus life
